<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بی‌سیم پلیسی آنلاین</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Tahoma,Arial,sans-serif;color:white;
 min-height:100vh;
 background:radial-gradient(circle at top,#263238,#101418 55%,#050607);
}
.container{width:min(520px,94%);margin:auto;padding:25px 0 40px}
.logo{text-align:center;font-size:58px;margin-top:10px}
h1{text-align:center;margin:5px 0 8px}
.subtitle{text-align:center;color:#b8c0c5;margin-bottom:25px}
.card{
 background:rgba(25,30,34,.94);border:1px solid #39434a;
 border-radius:20px;padding:20px;margin-bottom:16px;
 box-shadow:0 12px 30px #0005;
}
label{display:block;color:#cbd2d6;margin-bottom:7px}
input{
 width:100%;padding:15px;border-radius:12px;
 border:1px solid #4b565d;background:#111519;color:white;
 font-size:16px;outline:none;margin-bottom:12px;
}
button{
 width:100%;border:0;border-radius:14px;padding:15px;
 font-size:17px;font-weight:bold;cursor:pointer;margin-top:8px;
}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#d32f2f;color:white}
.secondary{background:#263238;color:white;border:1px solid #45545c}
.hidden{display:none!important}
.status{
 text-align:center;padding:12px;border-radius:12px;
 background:#151b1f;color:#9ee7aa;margin-bottom:15px;
}
.room{
 text-align:center;font-size:28px;letter-spacing:4px;
 background:#0b0f12;border:1px dashed #68757c;
 border-radius:14px;padding:15px;margin:12px 0;
}
.members{list-style:none;padding:0;margin:0}
.member{
 display:flex;align-items:center;justify-content:space-between;
 background:#151b1f;padding:12px;border-radius:12px;margin:7px 0;
}
.dot{
 width:11px;height:11px;border-radius:50%;background:#38d66b;
 display:inline-block;margin-left:8px;
}
.ptt{
 width:190px;height:190px;border-radius:50%;margin:25px auto;
 display:block;background:#b71c1c;color:white;
 border:8px solid #4a1111;
 box-shadow:0 0 0 8px #242b2f,0 15px 35px #0008;
 font-size:22px;user-select:none;touch-action:none;
}
.ptt.active{background:#16843b;border-color:#0d4823}
.small{color:#9ba6ac;font-size:13px;line-height:1.8}
.warning{color:#ffca7a}
#debug{white-space:pre-wrap;color:#9ba6ac;font-size:11px;margin-top:12px}
</style>
</head>

<body>
<div class="container">

<div class="logo">📻</div>
<h1>بی‌سیم پلیسی آنلاین</h1>
<div class="subtitle">گفت‌وگوی صوتی آنلاین برای ۲ تا ۱۰ نفر</div>

<section id="loginCard" class="card">
<label>نام شما</label>
<input id="nameInput" maxlength="20" placeholder="مثلاً امیرحسین">

<label>کد اتاق</label>
<input id="roomInput" maxlength="12" placeholder="مثلاً 2580" inputmode="numeric">

<button class="primary" id="joinBtn">🚨 ورود به اتاق</button>
<button class="secondary" id="createBtn">🎙️ ساخت اتاق جدید</button>

<p class="small">کد اتاق را به دوستانت بده تا وارد همان اتاق شوند.</p>
<p id="loginStatus" class="small"></p>
</section>

<section id="roomCard" class="hidden">

<div class="card">
<div id="status" class="status">در حال اتصال...</div>
<div>کد اتاق:</div>
<div id="roomCode" class="room">----</div>
<button class="secondary" id="copyBtn">📋 کپی کد اتاق</button>
</div>

<div class="card">
<h3>👮 افراد داخل اتاق</h3>
<ul id="members" class="members"></ul>
</div>

<div class="card">
<button id="ptt" class="ptt">
نگه دار<br>صحبت کن
</button>
<div id="micStatus" class="status">🎙️ برای صحبت دکمه را نگه دار</div>
<p class="small warning">برای استفاده از بی‌سیم اجازه میکروفون را تأیید کن.</p>
</div>

<div class="card">
<button class="primary" id="leaveBtn">🚪 خروج از اتاق</button>
</div>

<div id="debug"></div>
</section>
</div>

<script>
/* عناصر صفحه */
const $ = id => document.getElementById(id);

const loginCard=$("loginCard");
const roomCard=$("roomCard");
const nameInput=$("nameInput");
const roomInput=$("roomInput");
const loginStatus=$("loginStatus");
const statusBox=$("status");
const roomCode=$("roomCode");
const membersBox=$("members");
const ptt=$("ptt");
const micStatus=$("micStatus");
const debugBox=$("debug");

let peer=null;
let room="";
let myName="";
let myId="";
let hostId="";
let isHost=false;
let myStream=null;
let talking=false;
let stopped=false;

const peers={};
const names={};
const connections={};
const audioElements={};

function log(s){debugBox.textContent=String(s)}
function setStatus(s){statusBox.textContent=s}
function setMicStatus(s){micStatus.textContent=s}

function safeName(s){
 return String(s||"").trim().replace(/[<>]/g,"").slice(0,20)||"کاربر";
}

function cleanRoom(s){
 return String(s||"").trim().replace(/[^a-zA-Z0-9_-]/g,"").slice(0,12);
}

function randomRoom(){
 return String(Math.floor(1000+Math.random()*9000));
}

function hostPeerId(code){
 return "radio-host-"+code.toLowerCase();
}

function updateMembers(){
 membersBox.innerHTML="";
 const ids=Object.keys(names);

 if(!ids.length){
  membersBox.innerHTML="<li class='member'>هنوز کسی وارد نشده</li>";
  return;
 }

 ids.forEach(id=>{
  const li=document.createElement("li");
  li.className="member";

  const span=document.createElement("span");
  const dot=document.createElement("span");
  dot.className="dot";
  span.appendChild(dot);

  const label=document.createTextNode(
   (names[id]||"کاربر")+(id===myId?" (شما)":"")
  );
  span.appendChild(label);

  const icon=document.createTextNode(id===hostId?"👑":"🎙️");
  li.append(span,icon);
  membersBox.appendChild(li);
 });
}

/* بارگذاری کتابخانه PeerJS بدون متوقف کردن صفحه */
function loadPeerJS(){
 return new Promise((resolve,reject)=>{
  if(window.Peer){resolve();return;}

  const sources=[
   "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js",
   "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"
  ];

  let index=0;

  function next(){
   if(window.Peer){resolve();return;}
   if(index>=sources.length){
    reject(new Error("کتابخانه ارتباطی بارگذاری نشد."));
    return;
   }

   const script=document.createElement("script");
   script.src=sources[index++];
   script.onload=()=>{
    if(window.Peer) resolve();
    else next();
   };
   script.onerror=()=>{
    script.remove();
    next();
   };

   document.head.appendChild(script);
  }

  next();
 });
}

/* ساخت اتاق */
$("createBtn").onclick=async()=>{
 myName=safeName(nameInput.value);
 nameInput.value=myName;

 room=randomRoom();
 roomInput.value=room;

 isHost=true;
 hostId=hostPeerId(room);

 await startPeer(hostId);
};

/* ورود به اتاق */
$("joinBtn").onclick=async()=>{
 myName=safeName(nameInput.value);
 nameInput.value=myName;

 room=cleanRoom(roomInput.value);

 if(!room){
  alert("کد اتاق را وارد کن.");
  return;
 }

 isHost=false;
 hostId=hostPeerId(room);

 await startPeer();
};

/* شروع اتصال */
async function startPeer(customId=null){
 loginStatus.textContent="در حال آماده‌سازی اتصال...";

 $("createBtn").disabled=true;
 $("joinBtn").disabled=true;

 try{
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
   throw new Error("مرورگر اجازه استفاده از میکروفون را نمی‌دهد. از HTTPS استفاده کن.");
  }

  await loadPeerJS();

  myStream=await navigator.mediaDevices.getUserMedia({
   audio:{
    echoCancellation:true,
    noiseSuppression:true,
    autoGainControl:true
   },
   video:false
  });

  myStream.getAudioTracks().forEach(t=>t.enabled=false);

  peer=customId
   ?new Peer(customId,{debug:1})
   :new Peer({debug:1});

  peer.on("open",id=>{
   if(stopped)return;

   myId=id;
   names[myId]=myName;

   loginCard.classList.add("hidden");
   roomCard.classList.remove("hidden");
   roomCode.textContent=room;

   if(isHost){
    setStatus("🟢 اتاق ساخته شد؛ منتظر افراد هستیم.");
    updateMembers();
   }else{
    setStatus("🟡 در حال اتصال به اتاق...");
    connectToHost();
   }
  });

  peer.on("connection",conn=>{
   setupConnection(conn);
  });

  peer.on("call",call=>{
   answerCall(call);
  });

  peer.on("error",err=>{
   console.error(err);
   log(err.type||err.message||"خطای اتصال");

   if(err.type==="unavailable-id"){
    alert("این کد اتاق قبلاً استفاده شده است. دوباره اتاق بساز.");
    cleanup();
   }else if(err.type==="peer-unavailable"){
    setStatus("🔴 اتاق پیدا نشد. کد اتاق را بررسی کن.");
   }else{
    setStatus("⚠️ خطا در اتصال: "+(err.type||"نامشخص"));
   }
  });

  peer.on("disconnected",()=>{
   setStatus("🟠 ارتباط با سرور قطع شد.");
  });

  peer.on("close",()=>{
   setStatus("🔴 اتصال بسته شد.");
  });

 }catch(e){
  console.error(e);
  loginStatus.textContent=e.message||"خطا در راه‌اندازی";
  alert(
   "اتصال برقرار نشد:\n"+
   (e.message||"خطای ناشناخته")+
   "\n\nاجازه میکروفون و اینترنت را بررسی کن."
  );
  if(myStream){
   myStream.getTracks().forEach(t=>t.stop());
   myStream=null;
  }
  $("createBtn").disabled=false;
  $("joinBtn").disabled=false;
 }
}

/* اتصال به میزبان */
function connectToHost(){
 const conn=peer.connect(hostId,{reliable:true});
 setupConnection(conn);
}

/* مدیریت اتصال داده */
function setupConnection(conn){
 if(!conn||!conn.peer)return;

 if(connections[conn.peer]===conn)return;
 connections[conn.peer]=conn;

 conn.on("open",()=>{
  conn.send({
   type:"hello",
   id:myId,
   name:myName
  });
 });

 conn.on("data",data=>{
  handleData(conn,data);
 });

 conn.on("close",()=>{
  if(connections[conn.peer]===conn){
   delete connections[conn.peer];
  }

  if(isHost){
   delete names[conn.peer];
   broadcast({type:"remove-user",id:conn.peer});
   updateMembers();
  }else{
   removePeer(conn.peer);
  }
 });

 conn.on("error",e=>console.log(e));
}

/* پیام‌های اتاق */
function handleData(conn,data){
 if(!data||!data.type)return;

 if(data.type==="hello"){
  if(!isHost)return;

  if(!names[data.id]&&Object.keys(names).length>=10){
   conn.send({type:"reject",reason:"اتاق پر است."});
   conn.close();
   return;
  }

  names[data.id]=safeName(data.name);

  const list=Object.keys(names).map(id=>({
   id,
   name:names[id]
  }));

  conn.send({type:"roster",users:list});

  broadcast({
   type:"new-user",
   id:data.id,
   name:names[data.id]
  },conn.peer);

  updateMembers();
  return;
 }

 if(data.type==="roster"){
  if(!Array.isArray(data.users))return;

  data.users.forEach(user=>{
   if(user&&user.id){
    names[user.id]=safeName(user.name);
   }
  });

  updateMembers();

  data.users.forEach(user=>{
   if(user.id!==myId){
    connectToPeer(user.id);
   }
  });

  setStatus("🟢 به اتاق وصل شدی.");
  return;
 }

 if(data.type==="new-user"){
  if(data.id&&data.id!==myId){
   names[data.id]=safeName(data.name);
   updateMembers();
   connectToPeer(data.id);
  }
  return;
 }

 if(data.type==="remove-user"){
  removePeer(data.id);
  return;
 }

 if(data.type==="reject"){
  alert(data.reason||"ورود به اتاق ممکن نیست.");
  cleanup();
  return;
 }
}

/* ارسال پیام برای اعضا */
function broadcast(message,except=null){
 Object.keys(connections).forEach(id=>{
  if(id===except)return;
  const c=connections[id];
  if(c&&c.open){
   try{c.send(message)}catch(e){console.log(e)}
  }
 });
}

/* تماس صوتی */
function connectToPeer(remoteId){
 if(!remoteId||remoteId===myId||!peer||!myStream)return;
 if(peers[remoteId])return;

 /* فقط یک طرف تماس را آغاز می‌کند */
 if(myId>remoteId)return;

 const call=peer.call(remoteId,myStream);
 if(!call)return;

 peers[remoteId]=call;
 watchCall(call,remoteId);
}

function answerCall(call){
 if(!call||!myStream)return;

 if(peers[call.peer]){
  try{call.close()}catch(e){}
  return;
 }

 peers[call.peer]=call;

 try{
  call.answer(myStream);
 }catch(e){
  console.error(e);
 }

 watchCall(call,call.peer);
}

function watchCall(call,id){
 call.on("stream",stream=>{
  attachAudio(id,stream);
 });

 call.on("close",()=>{
  if(peers[id]===call)delete peers[id];
  removeAudio(id);
 });

 call.on("error",e=>{
  console.log("Audio error",e);
 });
}

/* پخش صدای دریافتی */
function attachAudio(id,stream){
 let audio=audioElements[id];

 if(!audio){
  audio=document.createElement("audio");
  audio.autoplay=true;
  audio.playsInline=true;
  audio.setAttribute("playsinline","");
  document.body.appendChild(audio);
  audioElements[id]=audio;
 }

 audio.srcObject=stream;
 audio.play().catch(e=>{
  console.log("پخش صدا نیاز به تعامل کاربر دارد",e);
 });
}

function removeAudio(id){
 const audio=audioElements[id];
 if(audio){
  audio.srcObject=null;
  audio.remove();
  delete audioElements[id];
 }
}

/* حذف عضو */
function removePeer(id){
 if(!id)return;

 delete names[id];

 if(peers[id]){
  try{peers[id].close()}catch(e){}
  delete peers[id];
 }

 if(connections[id]){
  try{connections[id].close()}catch(e){}
  delete connections[id];
 }

 removeAudio(id);
 updateMembers();
}

/* دکمه صحبت */
function startTalking(){
 if(!myStream||talking)return;

 talking=true;
 myStream.getAudioTracks().forEach(t=>t.enabled=true);

 ptt.classList.add("active");
 ptt.innerHTML="🔊<br>در حال صحبت";
 setMicStatus("🟢 صدای شما در حال ارسال است");
}

function stopTalking(){
 if(!myStream)return;

 talking=false;
 myStream.getAudioTracks().forEach(t=>t.enabled=false);

 ptt.classList.remove("active");
 ptt.innerHTML="نگه دار<br>صحبت کن";
 setMicStatus("🎙️ برای صحبت دکمه را نگه دار");
}

ptt.addEventListener("pointerdown",e=>{
 e.preventDefault();
 try{ptt.setPointerCapture(e.pointerId)}catch(err){}
 startTalking();
});

ptt.addEventListener("pointerup",e=>{
 e.preventDefault();
 stopTalking();
});

ptt.addEventListener("pointercancel",stopTalking);
ptt.addEventListener("lostpointercapture",stopTalking);
window.addEventListener("blur",stopTalking);
document.addEventListener("visibilitychange",()=>{
 if(document.hidden)stopTalking();
});

/* کپی کد */
$("copyBtn").onclick=async()=>{
 try{
  await navigator.clipboard.writeText(room);
  $("copyBtn").textContent="✅ کد کپی شد";
 }catch(e){
  prompt("کد اتاق را کپی کن:",room);
 }
 setTimeout(()=>{
  $("copyBtn").textContent="📋 کپی کد اتاق";
 },1500);
};

/* خروج */
$("leaveBtn").onclick=cleanup;

function cleanup(){
 stopped=true;
 stopTalking();

 Object.keys(peers).forEach(id=>{
  try{peers[id].close()}catch(e){}
 });

 Object.keys(connections).forEach(id=>{
  try{connections[id].close()}catch(e){}
 });

 if(myStream){
  myStream.getTracks().forEach(t=>t.stop());
  myStream=null;
 }

 if(peer){
  try{peer.destroy()}catch(e){}
 }

 location.reload();
}
</script>
</body>
</html>
